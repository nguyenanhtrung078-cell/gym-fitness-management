server {
    listen 80;
    server_name localhost;

    # ── Security Headers ──────────────────────────────────────────────────────
    add_header X-Content-Type-Options    "nosniff"                        always;
    add_header X-Frame-Options           "SAMEORIGIN"                     always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection          "1; mode=block"                  always;
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data:;" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

    # ── Hide Nginx version ───────────────────────────────────────────────────
    server_tokens off;

    # ── Gzip Compression ─────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # ── Reverse Proxy → Node.js App ──────────────────────────────────────────
    location / {
        proxy_pass         http://app:3000;
        proxy_http_version 1.1;

        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_read_timeout  90s;
        proxy_connect_timeout 90s;
        proxy_send_timeout  90s;
    }

    # ── Health-check endpoint (internal use) ─────────────────────────────────
    location /health {
        proxy_pass http://app:3000/health;
        access_log off;
    }
}
