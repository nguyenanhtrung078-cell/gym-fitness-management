services:
  # 1. Database: MySQL 8 (Isolated on internal-net)
  db:
    image: mysql:8.4
    container_name: trien-khai-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-gym_fitness}
      MYSQL_USER: ${DB_USER:-gym_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - internal-net

  # 2. Application: Node.js Express Backend & Frontend
  app:
    build:
      context: ./app
    container_name: trien-khai-app
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-gym_fitness}
      DB_USER: ${DB_USER:-gym_app}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      PORT: 3000
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@gym.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      OTP_SECRET: ${OTP_SECRET:?Set OTP_SECRET in .env}
      OTP_DELIVERY: ${OTP_DELIVERY:-email}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    # Port 3000 NOT exposed to host — access only through Nginx on port 80
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - internal-net
      - public-net
    security_opt:
      - no-new-privileges:true

  # 3. Reverse Proxy: Nginx with Security Headers
  nginx:
    image: nginx:1.27-alpine
    container_name: trien-khai-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - public-net
    security_opt:
      - no-new-privileges:true

  # 4. Database Administration: phpMyAdmin
  phpmyadmin:
    image: phpmyadmin:5-apache
    container_name: trien-khai-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 32M
    ports:
      - "${PMA_PORT:-8081}:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal-net
      - public-net

  # 5. Container Metrics: cAdvisor
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: trien-khai-cadvisor
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - internal-net

  # 6. MySQL Metrics: exporter runs only inside the internal network.
  mysqld-exporter:
    image: prom/mysqld-exporter:v0.16.0
    container_name: trien-khai-mysqld-exporter
    restart: unless-stopped
    environment:
      MYSQLD_EXPORTER_USER: ${DB_USER:-gym_app}
      MYSQLD_EXPORTER_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    command:
      - --config.my-cnf=/etc/mysqld-exporter/.my.cnf
      - --mysqld.address=db:3306
    volumes:
      - ./monitoring/mysql-exporter.cnf:/etc/mysqld-exporter/.my.cnf:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal-net
    security_opt:
      - no-new-privileges:true

  # 6. Monitoring & Metrics: Prometheus
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: trien-khai-prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    depends_on:
      - cadvisor
    networks:
      - public-net
      - internal-net

  # 7. Visualization & Dashboards: Grafana
  grafana:
    image: grafana/grafana:11.2.0
    container_name: trien-khai-grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
    networks:
      - public-net
      - internal-net

  # 8. Centralized Logging: Loki
  loki:
    image: grafana/loki:3.2.0
    container_name: trien-khai-loki
    restart: unless-stopped
    # Port 3100 NOT exposed to host — Grafana accesses Loki via internal-net
    command: -config.file=/etc/loki/config.yml
    volumes:
      - ./logging/loki-config.yml:/etc/loki/config.yml:ro
      - loki_data:/loki
    networks:
      - internal-net

  # 9. Log Collector: Promtail
  promtail:
    image: grafana/promtail:3.2.0
    container_name: trien-khai-promtail
    restart: unless-stopped
    volumes:
      - ./logging/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - internal-net

volumes:
  mysql_data:
  prometheus_data:
  grafana_data:
  loki_data:

networks:
  public-net:
    name: public-net
    driver: bridge
  internal-net:
    name: internal-net
    driver: bridge
    internal: true
